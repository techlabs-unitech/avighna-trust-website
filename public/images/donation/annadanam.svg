<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A thali of sattvic food, the gift of Anna Dhaanam">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d77c"/><stop offset=".55" stop-color="#e8892a"/><stop offset="1" stop-color="#a3201f"/></linearGradient>
    <radialGradient id="plate" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff3c4"/><stop offset=".6" stop-color="#e3a11c"/><stop offset="1" stop-color="#b9700f"/></radialGradient>
    <radialGradient id="rice" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9dfc6"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity=".18" fill="#fff7e0"><circle cx="90" cy="90" r="60"/><circle cx="720" cy="520" r="90"/><circle cx="700" cy="80" r="30"/></g>
  <ellipse cx="400" cy="470" rx="250" ry="34" fill="#2b0909" opacity=".35"/>
